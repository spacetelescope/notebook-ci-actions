name: Test GitHub Accessibility Scanner on Changed HTML Files

on:
  workflow_call:

jobs:
  find-html-files:
    runs-on: ubuntu-latest
    outputs:
      new_updated_html_files: ${{ steps.make-html-list.outputs.html_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.GITHUB_REPOSITORY }}
          ref: 'gh-pages'
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
      - name: Find added or modified HTML files
        id: make-html-list
        run: |
          # combine added and modified files into a single list
          CHANGED_FILES="${{ steps.changed-files.outputs.added_files }} ${{ steps.changed-files.outputs.modified_files }}"
          echo "All new or changed files: $CHANGED_FILES"
          # filter for .html files
          HTML_FILES=$(echo "$CHANGED_FILES" | tr ' ' '\n' | grep '\.html$' || true)
          
          # Define your text string and source environment variable
          ADD_TEXT="https://spacetelescope.github.io/${{ github.event.repository.name }}/"
          echo "Base URL for HTML files: $ADD_TEXT"
          TARGET_VAR="$HTML_FILES"

          # Initialize an empty variable to hold the new list
          NEW_LIST=""

          # Read the environment variable line by line
          while IFS= read -r line; do
              # Skip empty lines
              [[ -z "$line" ]] && continue

              # Process the line
              processed_line="${ADD_TEXT}${line}"

              # Append the processed line with a newline character
              if [[ -z "$NEW_LIST" ]]; then
                  NEW_LIST="$processed_line"
              else
                  NEW_LIST="${NEW_LIST}"$'\n'"$processed_line"
              fi
          done <<< "$TARGET_VAR"
          
          # Trim the list down to the last 5 entries (for testing purposes)
          NEW_LIST=$(echo "$NEW_LIST" | tail -n 5) #  <<<<< TODO: REMOVE PRIOR TO DEPLOYMENT <<<<<<
          
          # Check if the list is empty and provide a warning if so
          if [ -z "$NEW_LIST" ]; then
            echo "WARNING: No new or updated HTML files found. The accessibility scanner will not run."
          else
            echo "The following HTML files will be scanned:"
            echo "$NEW_LIST"
          fi
          
          # Export the result to a new environment variable
          export HTML_FILES="$NEW_LIST"
          
          # Output the new environment variable for use in subsequent steps
          echo "html_files<<EOF" >> $GITHUB_OUTPUT
          echo "$HTML_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  html_accessibility_scanner:
    if: ${{ needs.find-html-files.outputs.new_updated_html_files != '' }}
    runs-on: ubuntu-latest
    needs: find-html-files
    steps:
      - name: Generate cache key
        id: generate_cache_key
        run: |
          CACHE_KEY=$(printf 'cached_results-%s.json' "${{ github.ref_name }}" | tr -cs 'A-Za-z0-9/._-' '-')
          echo "Generated cache key: $CACHE_KEY"
          echo "cache_key=$CACHE_KEY" >> $GITHUB_OUTPUT
      - uses: github/accessibility-scanner@v3.4.1
        with:
          urls: ${{ needs.find-html-files.outputs.new_updated_html_files }}
          repository: ${{ github.repository }}
          token: ${{ secrets.A11Y_TOKEN }}
          cache_key: ${{ steps.generate_cache_key.outputs.cache_key }}
          dry_run: true # TODO: REMOVE PRIOR TO DEPLOYMENT
